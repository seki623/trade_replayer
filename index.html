<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickForge</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#d1d4dc;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh}
#toolbar{display:flex;align-items:center;padding:0 10px;background:#0c0c14;border-bottom:1px solid #1a1a28;height:44px;gap:8px;overflow-x:auto}
#status{width:7px;height:7px;border-radius:50%;background:#333;flex-shrink:0}
#status.ok{background:#26a69a} #status.err{background:#ef5350}
.source-btn{background:#14141f;color:#888;border:1px solid #2a2a3d;padding:4px 8px;font-size:11px;border-radius:4px;cursor:pointer;font-weight:bold;flex-shrink:0}
.source-btn.active{background:#2962ff;color:#fff;border-color:#2962ff}
#symbol-select, .replay-select{background:#14141f;color:#d1d4dc;border:1px solid #2a2a3d;padding:4px 8px;font-size:12px;border-radius:4px;outline:none}
.sltp-input{width:75px;background:#14141f;color:#d1d4dc;border:1px solid #2a2a3d;padding:3px 5px;font-size:11px;border-radius:4px;outline:none;text-align:right}
.tf-group{display:flex;gap:1px;flex-shrink:0}
.tf-btn{background:#14141f;color:#555;border:1px solid transparent;padding:2px 7px;font-size:10px;cursor:pointer;border-radius:2px;font-weight:600}
.tf-btn.active{background:#2962ff;color:#fff}
.replay-ctrl-group{display:flex;align-items:center;gap:4px;background:#10101a;padding:2px 6px;border-radius:4px;border:1px solid #1f1f30}
.btn-replay{background:#1f1f30;color:#d1d4dc;border:none;padding:3px 8px;font-size:11px;border-radius:3px;cursor:pointer}
.btn-buy{background:#26a69a;color:#fff;border:none;padding:3px 10px;font-size:11px;font-weight:bold;border-radius:3px;cursor:pointer}
.btn-sell{background:#ef5350;color:#fff;border:none;padding:3px 10px;font-size:11px;font-weight:bold;border-radius:3px;cursor:pointer}
.btn-close{background:#555;color:#fff;border:none;padding:3px 8px;font-size:11px;border-radius:3px;cursor:pointer}
.account-info{display:flex;gap:8px;font-size:11px;font-family:monospace;color:#aaa}
.pnl-plus{color:#26a69a} .pnl-minus{color:#ef5350}
#info{display:flex;gap:12px;margin-left:auto;align-items:center;font-size:12px;font-family:monospace;flex-shrink:0}
.lbl{color:#444;font-size:9px} .bid{color:#26a69a} .ask{color:#ef5350} .spread{color:#555}
#chart-container{width:100%;height:calc(100vh - 44px)}
</style>
</head>
<body>

<div id="toolbar">
  <div id="status" class="ok"></div>
  <button id="btn-mode-live" class="source-btn active" onclick="switchDataMode('live')">リアルタイム</button>
  <button id="btn-mode-replay" class="source-btn" onclick="switchDataMode('replay')">リプレイ</button>

  <select id="symbol-select"></select>
  <div class="tf-group" id="tf-group"></div>

  <div class="replay-ctrl-group">
    <span style="font-size:10px;color:#aaa">開始:</span>
    <input type="datetime-local" id="startTime" class="replay-select" value="2025-07-01T09:00">
    <span style="font-size:10px;color:#aaa">終了:</span>
    <input type="datetime-local" id="endTime" class="replay-select" value="2025-07-01T17:00">
    <button class="btn-replay" onclick="loadSelectedRange()">Load</button>
    <button class="btn-replay" onclick="startReplay()">▶</button>
    <button class="btn-replay" onclick="pauseReplay()">❚❚</button>
    <select id="speedSelect" class="replay-select" onchange="changeReplaySpeed(this.value)">
      <option value="500">1x</option><option value="200">2.5x</option><option value="50">10x</option>
    </select>
  </div>

  <div class="replay-ctrl-group">
    <span style="font-size:10px;color:#ef5350">SL価格:</span>
    <input type="number" id="input-sl" class="sltp-input" placeholder="SL価格" step="0.01">
    <span style="font-size:10px;color:#26a69a">TP価格:</span>
    <input type="number" id="input-tp" class="sltp-input" placeholder="TP価格" step="0.01">
    <button class="btn-buy" onclick="placePaperOrder('BUY')">BUY</button>
    <button class="btn-sell" onclick="placePaperOrder('SELL')">SELL</button>
    <button class="btn-close" onclick="closePaperPosition()">CLOSE</button>
  </div>

  <div class="account-info">
    <span>Eq:<span id="acc-equity" style="color:#fff">1,000,000</span></span>
    <span>PnL:<span id="acc-pnl" class="pnl-val">0</span></span>
  </div>

  <div id="info">
    <span><span class="lbl">B</span><span class="bid" id="bid-val">&mdash;</span></span>
    <span><span class="lbl">A</span><span class="ask" id="ask-val">&mdash;</span></span>
    <span class="spread" id="spread-val">&mdash;</span>
  </div>
</div>

<div id="chart-container"></div>

<script>
'use strict';
const CRYPTO = [{sym:'BTCUSDT',d:2,pip:1},{sym:'ETHUSDT',d:2,pip:1}];
const FX = [{sym:'USDJPY',d:3,pip:100},{sym:'EURUSD',d:5,pip:10000},{sym:'XAUUSD',d:2,pip:1}];
const ALL_SYMS = [...CRYPTO, ...FX];
const SYM_MAP = new Map(ALL_SYMS.map(s => [s.sym, s]));
const TIMEFRAMES = [{label:'1s',sec:1},{label:'1m',sec:60},{label:'5m',sec:300},{label:'1h',sec:3600}];
const JST = 9*3600;

let ws = null, reconnectTimer = null, chart = null, candleSeries = null, volumeSeries = null;
let currentSymbol = 'BTCUSDT', currentTfIdx = 1, dataMode = 'live', historyReqId = 0, lastBar = null;
let $bid, $ask, $spread, $status;

function symInfo(s) { return SYM_MAP.get(s) || {sym:s,d:2,pip:1}; }
function fmtPrice(v) { return typeof v === 'number' ? v.toFixed(symInfo(currentSymbol).d) : '--'; }

function initUI() {
  const sel = document.getElementById('symbol-select');
  ALL_SYMS.forEach(s => {
    const o = document.createElement('option');
    o.value = s.sym; o.textContent = s.sym;
    if(s.sym === currentSymbol) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = e => onSymbolSelect(e.target.value);

  const grp = document.getElementById('tf-group');
  TIMEFRAMES.forEach((tf, i) => {
    const b = document.createElement('button');
    b.className = 'tf-btn' + (i === currentTfIdx ? ' active' : '');
    b.textContent = tf.label;
    b.onclick = () => {
      currentTfIdx = i;
      grp.querySelectorAll('.tf-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      candleSeries.setData([]);
      if (dataMode === 'live') loadHistory(currentSymbol, i);
    };
    grp.appendChild(b);
  });
}

function switchDataMode(mode) {
  dataMode = mode;
  document.getElementById('btn-mode-live').classList.toggle('active', mode === 'live');
  document.getElementById('btn-mode-replay').classList.toggle('active', mode === 'replay');
  resetChartState();
  if (mode === 'live') {
    loadHistory(currentSymbol, currentTfIdx);
    connectBinance(currentSymbol);
  } else {
    disconnectWs();
    if (typeof pauseReplay === 'function') pauseReplay();
  }
}

function initChart() {
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: { background:{type:'solid',color:'#0a0a0f'}, textColor:'#444', fontFamily:"monospace", fontSize:11 },
    grid:{vertLines:{color:'#111118'},horzLines:{color:'#111118'}},
    timeScale:{borderColor:'#1a1a28',timeVisible:true,secondsVisible:true},
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'
  });
}

function disconnectWs() {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  $status.className = 'err';
}

function connectBinance(symbol) {
  disconnectWs();
  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@ticker`);
  ws.onopen = () => { $status.className = 'ok'; };
  ws.onmessage = e => {
    if (dataMode !== 'live') return;
    const m = JSON.parse(e.data);
    if (m.c) onLiveTick(m.s, parseFloat(m.c), parseFloat(m.b||m.c), parseFloat(m.a||m.c));
  };
  ws.onclose = () => {
    $status.className = 'err';
    if (dataMode === 'live') reconnectTimer = setTimeout(() => connectBinance(currentSymbol), 2000);
  };
}

function onLiveTick(symbol, price, bid, ask) {
  if (symbol !== currentSymbol || dataMode !== 'live') return;
  $bid.textContent = fmtPrice(bid);
  $ask.textContent = fmtPrice(ask);
  $spread.textContent = ((ask - bid) * symInfo(currentSymbol).pip).toFixed(1);

  const nowSec = Math.floor(Date.now() / 1000) + JST;
  const tfSec = TIMEFRAMES[currentTfIdx].sec;
  const barTime = Math.floor(nowSec / tfSec) * tfSec;

  if (!lastBar || lastBar.time !== barTime) {
    lastBar = { time: barTime, open: price, high: price, low: price, close: price };
  } else {
    lastBar.high = Math.max(lastBar.high, price);
    lastBar.low = Math.min(lastBar.low, price);
    lastBar.close = price;
  }
  candleSeries.update(lastBar);
}

function onSymbolSelect(sym) {
  currentSymbol = sym;
  resetChartState();
  if (dataMode === 'live') {
    loadHistory(sym, currentTfIdx);
    connectBinance(sym);
  }
}

function resetChartState() {
  lastBar = null;
  if(candleSeries) candleSeries.setData([]);
  if (typeof clearTradeVisuals === 'function') clearTradeVisuals();
}

async function loadHistory(symbol, tfIdx) {
  if (dataMode !== 'live') return;
  const reqId = ++historyReqId;
  const map = {60:'1m',300:'5m',3600:'1h'};
  const interval = map[TIMEFRAMES[tfIdx].sec] || '1m';

  try {
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=300`);
    if (!res.ok || reqId !== historyReqId) return;
    const raw = await res.json();
    const candles = raw.map(k => ({
      time: Math.floor(k[0]/1000) + JST, open:parseFloat(k[1]), high:parseFloat(k[2]), low:parseFloat(k[3]), close:parseFloat(k[4])
    }));
    if (reqId === historyReqId) {
      candleSeries.setData(candles);
      chart.timeScale().fitContent();
    }
  } catch(e) {}
}

(function boot() {
  $bid = document.getElementById('bid-val');
  $ask = document.getElementById('ask-val');
  $spread = document.getElementById('spread-val');
  $status = document.getElementById('status');
  initUI();
  initChart();
  loadHistory(currentSymbol, currentTfIdx);
  connectBinance(currentSymbol);
})();
</script>
<script src="replay_and_trade.js"></script>
</body>
</html>
