<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickForge</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#d1d4dc;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}

#toolbar{
  display:flex;align-items:center;padding:0 10px;
  background:#0c0c14;border-bottom:1px solid #1a1a28;height:44px;gap:8px;
  flex-wrap:nowrap;overflow-x:auto;
}
#status{width:7px;height:7px;border-radius:50%;background:#333;flex-shrink:0}
#status.ok{background:#26a69a}
#status.err{background:#ef5350}

.source-btn{
  background:#14141f;color:#888;border:1px solid #2a2a3d;
  padding:4px 8px;font-size:11px;border-radius:4px;cursor:pointer;font-weight:bold;
  transition:all 0.15s;flex-shrink:0;
}
.source-btn.active{background:#2962ff;color:#fff;border-color:#2962ff}

#symbol-select, .replay-select{
  background:#14141f;color:#d1d4dc;border:1px solid #2a2a3d;
  padding:4px 8px;font-size:12px;border-radius:4px;outline:none;cursor:pointer;
}

.sltp-input{
  width:60px;background:#14141f;color:#d1d4dc;border:1px solid #2a2a3d;
  padding:3px 5px;font-size:11px;border-radius:4px;outline:none;text-align:right;
}

.tf-group{display:flex;gap:1px;flex-shrink:0}
.tf-btn{
  background:#14141f;color:#555;border:1px solid transparent;
  padding:2px 7px;font-size:10px;cursor:pointer;border-radius:2px;
  transition:all 0.12s;font-weight:600;letter-spacing:0.2px;
}
.tf-btn:hover{color:#aaa;background:#1c1c30}
.tf-btn.active{background:#2962ff;color:#fff}

.replay-ctrl-group{display:flex;align-items:center;gap:4px;background:#10101a;padding:2px 6px;border-radius:4px;border:1px solid #1f1f30}
.btn-replay{background:#1f1f30;color:#d1d4dc;border:none;padding:3px 8px;font-size:11px;border-radius:3px;cursor:pointer;font-weight:600}
.btn-replay:hover{background:#2a2a42}
.btn-buy{background:#26a69a;color:#fff;border:none;padding:3px 10px;font-size:11px;font-weight:bold;border-radius:3px;cursor:pointer}
.btn-buy:hover{background:#208b81}
.btn-sell{background:#ef5350;color:#fff;border:none;padding:3px 10px;font-size:11px;font-weight:bold;border-radius:3px;cursor:pointer}
.btn-sell:hover{background:#c94340}
.btn-close{background:#555;color:#fff;border:none;padding:3px 8px;font-size:11px;border-radius:3px;cursor:pointer}
.btn-close:hover{background:#666}

.account-info{display:flex;gap:8px;font-size:11px;font-family:'Consolas','SF Mono',monospace;color:#aaa}
.pnl-val{font-weight:bold}
.pnl-plus{color:#26a69a}
.pnl-minus{color:#ef5350}

#info{display:flex;gap:12px;margin-left:auto;align-items:center;font-size:12px;font-family:'Consolas','SF Mono',monospace;flex-shrink:0}
.lbl{color:#444;font-size:9px;margin-right:1px}
.bid{color:#26a69a}.ask{color:#ef5350}
.spread{color:#555}
#tps{color:#333;font-size:10px}
#candle-ticks{color:#333;font-size:10px}

#chart-container{width:100%;height:calc(100vh - 44px)}
</style>
</head>
<body>

<div id="toolbar">
  <div id="status" class="ok"></div>
  
  <!-- データソース選択ボタン -->
  <button id="btn-mode-live" class="source-btn active" onclick="switchDataMode('live')">リアルタイム</button>
  <button id="btn-mode-replay" class="source-btn" onclick="switchDataMode('replay')">リプレイ</button>

  <select id="symbol-select"></select>
  <div class="tf-group" id="tf-group"></div>

  <!-- リプレイ & コントロール -->
  <div class="replay-ctrl-group" id="replay-controls">
    <span style="font-size:10px;color:#aaa">開始:</span>
    <input type="datetime-local" id="startTime" class="replay-select" value="2025-07-01T09:00">
    <span style="font-size:10px;color:#aaa">終了:</span>
    <input type="datetime-local" id="endTime" class="replay-select" value="2025-07-01T17:00">
    
    <button class="btn-replay" onclick="loadSelectedRange()">Load</button>
    <button class="btn-replay" onclick="startReplay()">▶</button>
    <button class="btn-replay" onclick="pauseReplay()">❚❚</button>
    <select id="speedSelect" class="replay-select" onchange="changeReplaySpeed(this.value)">
      <option value="500">1x</option>
      <option value="200">2.5x</option>
      <option value="50">10x</option>
      <option value="10">50x</option>
    </select>
  </div>

  <!-- 注文 & SL/TP 入力グループ -->
  <div class="replay-ctrl-group">
    <span style="font-size:10px;color:#ef5350">SL:</span>
    <input type="number" id="input-sl" class="sltp-input" placeholder="指値/幅" step="0.1">
    <span style="font-size:10px;color:#26a69a">TP:</span>
    <input type="number" id="input-tp" class="sltp-input" placeholder="指値/幅" step="0.1">
    
    <button class="btn-buy" onclick="placePaperOrder('BUY')">BUY</button>
    <button class="btn-sell" onclick="placePaperOrder('SELL')">SELL</button>
    <button class="btn-close" onclick="closePaperPosition()">CLOSE</button>
  </div>

  <div class="account-info">
    <span>Eq:<span id="acc-equity" style="color:#fff">1,000,000</span></span>
    <span>PnL:<span id="acc-pnl" class="pnl-val">0</span></span>
  </div>

  <div id="info">
    <span><span class="lbl">B</span><span class="bid" id="bid-val">&mdash;</span></span>
    <span><span class="lbl">A</span><span class="ask" id="ask-val">&mdash;</span></span>
    <span class="spread" id="spread-val">&mdash;</span>
    <span id="tps"></span>
    <span id="candle-ticks"></span>
  </div>
</div>

<div id="chart-container"></div>

<script>
'use strict';

/* ── Symbols & Timeframes ───────────────────── */
const CRYPTO = [
  {sym:'BTCUSDT', d:2, pip:1},
  {sym:'ETHUSDT', d:2, pip:1},
];
const FX = [
  {sym:'USDJPY',d:3,pip:100},{sym:'EURUSD',d:5,pip:10000},{sym:'GBPUSD',d:5,pip:10000},
  {sym:'XAUUSD',d:2,pip:1},{sym:'XAGUSD',d:3,pip:100},{sym:'JP225',d:1,pip:1}
];
const ALL_SYMS = [...CRYPTO, ...FX];
const SYM_MAP = new Map(ALL_SYMS.map(s => [s.sym, s]));
const CRYPTO_SET = new Set(CRYPTO.map(c => c.sym));

const TIMEFRAMES = [
  {label:'Tick',sec:0},
  {label:'1s',sec:1},{label:'5s',sec:5},{label:'15s',sec:15},{label:'30s',sec:30},
  {label:'1m',sec:60},{label:'5m',sec:300},{label:'15m',sec:900},
  {label:'1h',sec:3600},{label:'4h',sec:14400},
  {label:'1D',sec:86400}
];

const JST = 9*3600;

/* ── State ──────────────────────────────────── */
let ws = null;
let chart = null;
let candleSeries = null, volumeSeries = null;
let currentSymbol = 'BTCUSDT';
let currentTfIdx = 5; // 1m
let dataMode = 'live'; // 'live' | 'replay'

let currentCandle = null, currentVolume = null;
let historyReqId = 0;
let cachedInfo = null;

let $bid, $ask, $spread, $status;

function symInfo(sym) { return SYM_MAP.get(sym) || {sym,d:2,pip:1}; }
function isCrypto(sym) { return CRYPTO_SET.has(sym); }
function isTickMode() { return TIMEFRAMES[currentTfIdx].sec === 0; }
function fmtPrice(v) { return typeof v === 'number' ? v.toFixed(cachedInfo.d) : '--'; }

function clearSeries() {
  candleSeries.setData([]);
  volumeSeries.setData([]);
}

function addS(type, opts) {
  const map = {Candlestick:'CandlestickSeries',Histogram:'HistogramSeries'};
  const st = LightweightCharts[map[type]];
  if (st && chart.addSeries) { try { return chart.addSeries(st, opts); } catch(e){} }
  return chart['add'+type+'Series'](opts);
}

function initUI() {
  const sel = document.getElementById('symbol-select');
  appendOptgroup(sel, 'Crypto', CRYPTO, currentSymbol);
  appendOptgroup(sel, 'FX / Commodities / Index', FX, currentSymbol);
  sel.onchange = e => onSymbolSelect(e.target.value);

  const grp = document.getElementById('tf-group');
  TIMEFRAMES.forEach((tf, i) => {
    const b = document.createElement('button');
    b.className = 'tf-btn' + (i === currentTfIdx ? ' active' : '');
    b.textContent = tf.label;
    b.onclick = () => {
      currentTfIdx = i;
      grp.querySelectorAll('.tf-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      clearSeries();
      if (dataMode === 'live' && !isTickMode() && isCrypto(currentSymbol)) {
        loadHistory(currentSymbol, i);
      }
    };
    grp.appendChild(b);
  });
}

function appendOptgroup(sel, label, items, selectedSym) {
  const g = document.createElement('optgroup');
  g.label = label;
  items.forEach(({sym}) => {
    const o = document.createElement('option');
    o.value = sym; o.textContent = sym;
    if (sym === selectedSym) o.selected = true;
    g.appendChild(o);
  });
  sel.appendChild(g);
}

function switchDataMode(mode) {
  dataMode = mode;
  document.getElementById('btn-mode-live').classList.toggle('active', mode === 'live');
  document.getElementById('btn-mode-replay').classList.toggle('active', mode === 'replay');

  resetChartState();

  if (mode === 'live') {
    if (isCrypto(currentSymbol)) {
      loadHistory(currentSymbol, currentTfIdx);
      connectBinance(currentSymbol);
    }
  } else {
    disconnectWs();
    if (typeof pauseReplay === 'function') pauseReplay();
  }
}

function initChart() {
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: { background:{type:'solid',color:'#0a0a0f'}, textColor:'#444', fontFamily:"'Consolas','SF Mono',monospace", fontSize:11 },
    grid:{vertLines:{color:'#111118'},horzLines:{color:'#111118'}},
    rightPriceScale:{borderColor:'#1a1a28'},
    timeScale:{borderColor:'#1a1a28',timeVisible:true,secondsVisible:true},
  });

  volumeSeries = addS('Histogram',{color:'#1a3a5c',priceFormat:{type:'volume'},priceScaleId:'vol'});
  volumeSeries.priceScale().applyOptions({scaleMargins:{top:0.85,bottom:0}});

  candleSeries = addS('Candlestick',{
    upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350',
  });

  applyPrecision();
}

function applyPrecision() {
  cachedInfo = symInfo(currentSymbol);
  const pf = {type:'price',precision:cachedInfo.d,minMove:Math.pow(10,-cachedInfo.d)};
  candleSeries.applyOptions({priceFormat:pf});
}

function disconnectWs() {
  if (ws) { ws.onclose = null; ws.onerror = null; ws.close(); ws = null; }
  $status.className = 'err';
}

function connectBinance(symbol) {
  disconnectWs();
  const stream = symbol.toLowerCase() + '@bookTicker';
  ws = new WebSocket('wss://stream.binance.com:9443/ws/' + stream);
  ws.onopen = () => { $status.className = 'ok'; };
  ws.onmessage = e => {
    if (dataMode !== 'live') return;
    const m = JSON.parse(e.data);
    if (m.b && m.a) {
      onTick({ symbol: m.s, best_bid: m.b, best_ask: m.a, server_ts: Date.now() });
    }
  };
  ws.onclose = () => { $status.className = 'err'; };
}

function onSymbolSelect(sym) {
  currentSymbol = sym;
  resetChartState();
  applyPrecision();

  if (dataMode === 'live') {
    if (isCrypto(sym)) {
      loadHistory(sym, currentTfIdx);
      connectBinance(sym);
    } else {
      disconnectWs();
    }
  }
}

function resetChartState() {
  currentCandle = null; currentVolume = null;
  historyReqId++;
  clearSeries();
  if (typeof clearTradeVisuals === 'function') clearTradeVisuals();
  $bid.textContent = '\u2014'; $ask.textContent = '\u2014'; $spread.textContent = '\u2014';
}

function onTick(tick) {
  if (tick.symbol !== currentSymbol || dataMode !== 'live') return;
  const bid = parseFloat(tick.best_bid), ask = parseFloat(tick.best_ask);
  $bid.textContent = fmtPrice(bid);
  $ask.textContent = fmtPrice(ask);
  $spread.textContent = ((ask - bid) * cachedInfo.pip).toFixed(1);
}

async function loadHistory(symbol, tfIdx) {
  if (isTickMode() || !isCrypto(symbol) || dataMode !== 'live') return;
  const reqId = ++historyReqId;
  const BINANCE_TF_MAP = {60:'1m',300:'5m',900:'15m',3600:'1h',14400:'4h',86400:'1d'};
  const interval = BINANCE_TF_MAP[TIMEFRAMES[tfIdx].sec];
  if (!interval) return;

  try {
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=500`);
    if (!res.ok || reqId !== historyReqId) return;
    const raw = await res.json();
    const candles = raw.map(k => ({
      time: Math.floor(k[0]/1000) + JST, open:parseFloat(k[1]), high:parseFloat(k[2]), low:parseFloat(k[3]), close:parseFloat(k[4])
    }));
    if (candles.length > 0 && reqId === historyReqId) {
      candleSeries.setData(candles);
      chart.timeScale().fitContent();
    }
  } catch(e) {}
}

(function boot() {
  $bid = document.getElementById('bid-val');
  $ask = document.getElementById('ask-val');
  $spread = document.getElementById('spread-val');
  $status = document.getElementById('status');

  initUI();
  initChart();
  if (isCrypto(currentSymbol)) {
    loadHistory(currentSymbol, currentTfIdx);
    connectBinance(currentSymbol);
  }
})();
</script>

<script src="replay_and_trade.js"></script>
</body>
</html>
